<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subway Surfers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070708;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(420px, 92vw);
      background: #121214;
      border: 1px solid #2a2a2e;
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
    }
    h1 { font-size: 34px; letter-spacing: 1px; }
    h1 b { color: #e10600; }
    p { color: #c9c9ce; margin: 12px 0 22px; line-height: 1.4; }
    a.play {
      display: block;
      background: #e10600;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 2px;
      padding: 16px 18px;
      border-radius: 14px;
    }
    small { display: block; margin-top: 14px; color: #8a8a90; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SUBWAY <b>SURFERS</b></h1>
    <p>Clique em JOGAR para abrir o jogo no navegador.</p>
    <a class="play" href="https://poki.com/en/g/subway-surfers">JOGAR</a>
    <small>Na primeira vez espera o Loading subir. Precisa de internet.</small>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subway Surfers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(225,6,0,.28), transparent 55%),
        radial-gradient(700px 400px at 80% 110%, rgba(225,6,0,.12), transparent 50%),
        #070708;
    }
    .wrap {
      width: min(420px, 92vw);
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border: 1px solid #3a3a40;
      border-radius: 999px;
      color: #cfcfd4;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(34px, 10vw, 52px);
      line-height: .9;
      letter-spacing: 1px;
    }
    h1 b { color: #e10600; }
    p {
      margin: 14px 0 28px;
      color: #b8b8bf;
      line-height: 1.45;
    }
    .play {
      display: block;
      width: 100%;
      background: #e10600;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 2px;
      padding: 16px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(225,6,0,.28);
    }
    .bar {
      width: 100%;
      height: 6px;
      margin-top: 22px;
      background: #1c1c20;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: #e10600;
      animation: load 1.6s ease forwards;
    }
    @keyframes load {
      to { width: 100%; }
    }
  </style>
  <script>
    var GAME = "https://tavvkkj.xyz/winter-holiday/reborn/original";
    setTimeout(function () { location.replace(GAME); }, 1700);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="badge">Winter Holiday</div>
    <h1>SUBWAY<br><b>SURFERS</b></h1>
    <p>Abrindo o jogo agora.</p>
    <a class="play" href="https://tavvkkj.xyz/winter-holiday/reborn/original">JOGAR</a>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
